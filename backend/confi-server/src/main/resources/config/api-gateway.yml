server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      mvc:
        routes:
          - id: users-service
            uri: lb://users-service
            predicates:
              - Path=/api/users/**

          - id: auth-service
            uri: lb://auth-service
            predicates:
              - Path=/api/auth/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/